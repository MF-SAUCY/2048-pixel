<title>2048</title>

<style>
/* 2048 — Pixel 11 build.
 *
 * Gabriele Cirulli's original game, retuned for one device: a 6.3" 1080x2424
 * OLED (about 412 x 915 CSS px), 60-120Hz adaptive, P3 wide gamut, 3000 nits,
 * Tensor G6. Decisions here optimise for that panel rather than for the wide
 * range of phones a generic build has to survive.
 *
 * What upstream did and why it is gone:
 *   - The board was pinned to 280px on anything under 520px wide, leaving a
 *     third of this screen empty. Here the board is one length, --board, that
 *     fills the display width, and every dimension derives from it.
 *   - Tiles were positioned with fixed px transforms per breakpoint. Here they
 *     are percentages of the tile's own box, so the geometry is resolution
 *     independent and the 497ppi panel gets sub-pixel-exact placement.
 *
 * Grid math, all as a fraction of --board:
 *   gap g = 3%, cell c = 21.25%   (4c + 5g = 100%)
 *   cell origin along an axis = 3% + (index - 1) * 24.25%
 * translate() resolves % against the element's OWN box, so each board-percentage
 * is divided by 21.25:  3% -> 14.1176%,  one step 24.25% -> 114.1176%.
 */

@font-face {
  font-family: "Clear Sans";
  src: url("style/fonts/ClearSans-Light-webfont.woff") format("woff");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Clear Sans";
  src: url("style/fonts/ClearSans-Regular-webfont.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Clear Sans";
  src: url("style/fonts/ClearSans-Bold-webfont.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  /* Structural colours — the cream identity, unchanged. The night palette lower
     down aliases these same tokens, so every colour is painted explicitly and
     none is inherited from the host page in either theme. */
  color-scheme: light;

  --ground: #faf8ef;
  --ink: #776e65;
  --ink-muted: rgba(119, 110, 101, 0.85);
  --ink-light: #f9f6f2;
  --board-bg: #bbada0;
  --cell-empty: rgba(238, 228, 218, 0.35);
  --button: #8f7a66;
  --button-active: #9f8b77;
  --score-label: #eee4da;
  --score-add: rgba(119, 110, 101, 0.9);
  --overlay: rgba(238, 228, 218, 0.73);
  --overlay-won: rgba(237, 194, 46, 0.5);

  /* Tile ramp, sRGB fallback. The P3 block below restates all of it.
   *
   * A temperature gradient: orchid at 2, cooling through periwinkle and blue to
   * cyan, then warming through green, chartreuse and gold to the hot red-orange
   * at 2048.
   *
   * Spliced from two solves by tools/make_gradient.py rather than one. The low
   * end (2-16) comes from a run with a hard lightness climb, which is what the
   * blues need — cyan is perceptually compressed, so rotating hue through it
   * buys far less separation than the same rotation through greens or golds,
   * and those tiles need lightness to tell them apart. The high end (32-2048)
   * comes from a gentler run, whose shallower approach to the terminal red
   * avoids the ΔE 32 cliff the steeper one left between 1024 and 2048.
   *
   * The result beats either source ramp: worst adjacent pair ΔE 12.07, worst
   * step 2->4 down to 14.06, and no two tiles anywhere on the board — adjacent
   * on the ramp or not — closer than ΔE 12. Upstream's gold run bottomed out at
   * 2.18. Re-measure with tools/check_ramp.py.
   */
  --t2: #daaddc;
  --t4: #bebbff;
  --t8: #95d1ff;
  --t16: #39e7ff;
  --t32: #00d5c3;
  --t64: #00db97;
  --t128: #63d754;
  --t256: #a4c800;
  --t512: #d2ae00;
  --t1024: #f28b00;
  --t2048: #ff6035;
  --tsuper: #3c3a32;

  /* One ink for every tile. Upstream switched from dark to light text partway
     up the ramp, which puts nine of its twelve tiles under the 3:1 that large
     bold text has to meet — as low as 1.42:1 on the 128. With lightness moving
     the way it does here there is no single switch point that works anyway, and
     this near-black clears 5.43:1 against the worst tile on the ramp, past even
     the 4.5:1 normal-text bar. */
  --tile-ink: #241f1a;

  /* 12px gutters rather than 16 — on a 412px screen every pixel of board is
     worth more than the margin. */
  --gutter: 12px;
  --chrome: 236px; /* heading + controls + footer + palette switch + padding */
  --board-cap: 560px;

  --avail-h: calc(100vh - var(--chrome));
  --board: min(calc(100vw - 2 * var(--gutter)), var(--avail-h), var(--board-cap));

  --cell: calc(var(--board) * 0.2125);
  --radius: calc(var(--board) * 0.008);
  --radius-board: calc(var(--board) * 0.014);

  /* Motion. At 120Hz a 90ms slide is ~11 frames, enough to read as a glide
     rather than a jump, and short enough that a fast player is never waiting on
     the animation. The curve is a decelerating ease-out: quick departure, soft
     arrival, no overshoot to fight the next move. */
  --slide: 90ms;
  --slide-ease: cubic-bezier(0.22, 0.85, 0.28, 1);
}

/* On a phone 100vh is the tall, URL-bar-hidden height, which overflows while
   the bar is showing. 100svh is the honest one. */
@supports (height: 100svh) {
  :root {
    --avail-h: calc(100svh - var(--chrome));
  }
}

/* The leaderboard is injected only when a backend is configured, so its height
   is reserved only when it is really there. */
:root:has(.leaderboard) {
  --chrome: 338px;
}

/* Wide gamut. The ramp is drawn at high chroma the whole way round, and the
   cyan-to-green stretch in particular sits well outside sRGB — these are the
   colours the ramp was actually solved for, with the hex values above as the
   clipped fallback. The board and ground stay as they are: they carry the
   game's identity and gain nothing from the extra gamut. */
@supports (color: color(display-p3 1 1 1)) {
  :root {
    --t2: color(display-p3 0.826 0.685 0.852);
    --t4: color(display-p3 0.739 0.732 1.000);
    --t8: color(display-p3 0.617 0.816 1.000);
    --t16: color(display-p3 0.405 0.899 1.000);
    --t32: color(display-p3 0.000 0.845 0.771);
    --t64: color(display-p3 0.321 0.856 0.593);
    --t128: color(display-p3 0.510 0.835 0.400);
    --t256: color(display-p3 0.667 0.780 0.228);
    --t512: color(display-p3 0.808 0.687 0.112);
    --t1024: color(display-p3 0.926 0.548 0.108);
    --t2048: color(display-p3 1.000 0.345 0.190);
  }
}

/* ---- original palette ----
 *
 * Gabriele Cirulli's exact sRGB values, offered as a switch. Deliberately not
 * extended into display-p3 the way the custom ramp is: "Original" should mean
 * the colours upstream actually ships, not an enhanced version of them.
 *
 * The ink reverts too. Upstream runs dark text on the two pale tiles and white
 * from 8 upward — the split the custom ramp does without. It is also where
 * upstream's legibility goes: nine of its twelve tiles put text under 3:1, the
 * floor being 1.42:1 on the 128. Faithful, and worth seeing next to the other
 * option.
 *
 * One thing is not reverted: the 2 and 4 tiles are still darkened for night
 * play. At #eee4da they are near-white, and sixteen of them on a near-black
 * ground is genuinely unpleasant. Upstream has no dark theme at all, so there
 * is no original behaviour to be faithful to here.
 */
:root[data-palette="original"] {
  --t2: #eee4da;
  --t4: #ede0c8;
  --t8: #f2b179;
  --t16: #f59563;
  --t32: #f67c5f;
  --t64: #f65e3b;
  --t128: #edcf72;
  --t256: #edcc61;
  --t512: #edc850;
  --t1024: #edc53f;
  --t2048: #edc22e;
  --tile-ink: #776e65;
}

:root[data-palette="original"] .tile-8 .tile-inner,
:root[data-palette="original"] .tile-16 .tile-inner,
:root[data-palette="original"] .tile-32 .tile-inner,
:root[data-palette="original"] .tile-64 .tile-inner,
:root[data-palette="original"] .tile-128 .tile-inner,
:root[data-palette="original"] .tile-256 .tile-inner,
:root[data-palette="original"] .tile-512 .tile-inner,
:root[data-palette="original"] .tile-1024 .tile-inner,
:root[data-palette="original"] .tile-2048 .tile-inner {
  color: var(--ink-light);
}

/* Darkening the two pale tiles for night also has to move the ink that sits on
   them. Upstream's #776e65 was chosen against near-white; on the darkened tile
   it lands at 2.01:1, which is unreadable. The tiles from 8 up keep upstream's
   white, since those colours are unchanged. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-palette="original"] {
    --t2: #4a4137;
    --t4: #5c5044;
    --tile-ink: var(--d-ink);
  }
}

:root[data-theme="dark"][data-palette="original"] {
  --t2: #4a4137;
  --t4: #5c5044;
  --tile-ink: var(--d-ink);
}

/* ---- night palette ----
 *
 * Defined here as --d-* and aliased onto the live tokens by the two blocks
 * below, so the dark values are written once rather than once per theme state.
 *
 * Only the structural colours change, plus the tile past 2048. The gradient is
 * identical in both themes: every one of its stops is a mid-lightness saturated
 * colour that holds against a cream board and a near-black one alike, which the
 * old ramp could not claim — its 2 and 4 were near-white and had to be darkened
 * for night play. What does change is the ground, a warm near-black rather than
 * a neutral grey, since grey next to this board reads as dirty and near-black
 * costs an OLED almost nothing to light.
 */
:root {
  --d-ground: #14110e;
  --d-ink: #d6cec3;
  --d-ink-muted: rgba(214, 206, 195, 0.68);
  --d-board-bg: #2f2822;
  --d-cell-empty: rgba(238, 228, 218, 0.04);
  --d-button: #8f7a66;
  --d-button-active: #a38d78;
  --d-score-label: rgba(238, 228, 218, 0.72);
  --d-score-add: rgba(214, 206, 195, 0.9);
  --d-overlay: rgba(20, 17, 14, 0.8);
  --d-overlay-won: rgba(237, 194, 46, 0.34);
  --d-tsuper: #0d0b09;
}

/* System dark, unless the page has been explicitly set to light. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: var(--d-ground);
    --ink: var(--d-ink);
    --ink-muted: var(--d-ink-muted);
    --board-bg: var(--d-board-bg);
    --cell-empty: var(--d-cell-empty);
    --button: var(--d-button);
    --button-active: var(--d-button-active);
    --score-label: var(--d-score-label);
    --score-add: var(--d-score-add);
    --overlay: var(--d-overlay);
    --overlay-won: var(--d-overlay-won);
    --tsuper: var(--d-tsuper);
  }
}

/* Explicit dark, so the toggle wins over a light system setting. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: var(--d-ground);
  --ink: var(--d-ink);
  --ink-muted: var(--d-ink-muted);
  --board-bg: var(--d-board-bg);
  --cell-empty: var(--d-cell-empty);
  --button: var(--d-button);
  --button-active: var(--d-button-active);
  --score-label: var(--d-score-label);
  --score-add: var(--d-score-add);
  --overlay: var(--d-overlay);
  --overlay-won: var(--d-overlay-won);
  --tsuper: var(--d-tsuper);
}

html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
  overscroll-behavior: none; /* stop pull-to-refresh eating a down-swipe */
  background: var(--ground);
  color: var(--ink);
  font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
}

body {
  display: flex;
  justify-content: center;
  overflow: hidden;
  touch-action: none; /* swipes are ours, not the browser's */
  -webkit-tap-highlight-color: transparent;
}

.container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  width: var(--board);
  padding-block: 14px;
  padding-inline: 0;
}

/* ---- heading ---- */

.heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

h1.title {
  margin: 0;
  font-size: clamp(42px, calc(var(--board) * 0.17), 80px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
}

.scores-container {
  display: flex;
  gap: 6px;
}

.score-container,
.best-container {
  position: relative;
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  justify-content: center;
  min-width: 62px;
  padding: 8px 12px;
  border-radius: 4px;
  background: var(--board-bg);
  color: var(--ink-light);
  font-size: clamp(17px, calc(var(--board) * 0.055), 26px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

/* "Score" / "Best" caption; column-reverse puts it above the number. */
.score-container::after,
.best-container::after {
  content: "Score";
  color: var(--score-label);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.best-container::after {
  content: "Best";
}

.score-container .score-addition {
  position: absolute;
  right: 12px;
  z-index: 2;
  color: var(--score-add);
  font-size: 22px;
  font-weight: 700;
  line-height: 22px;
  animation: move-up 600ms ease-in;
  animation-fill-mode: both;
  pointer-events: none;
}

/* Percentages of the score box, so the +N starts level with the number and
   clears the box entirely on its way up rather than crossing the SCORE label. */
@keyframes move-up {
  0% {
    top: 46%;
    opacity: 1;
  }
  100% {
    top: -62%;
    opacity: 0;
  }
}

/* ---- controls row ---- */

.above-game {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.game-intro {
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
}

.restart-button {
  flex: 0 0 auto;
  padding: 0 20px;
  border-radius: 4px;
  background: var(--button);
  color: var(--ink-light);
  font-size: 15px;
  font-weight: 700;
  line-height: 46px; /* a comfortable thumb target */
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 160ms ease, color 240ms ease, transform 120ms var(--slide-ease);
}

/* Waiting for the confirming second tap: the filled button turns into an
   outline. A fill swap is too subtle in the day palette, where the ink and
   button browns sit close together; an outline reads in both themes. */
.restart-button.is-armed {
  background: var(--ground);
  color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--ink);
}

.restart-button:active {
  background: var(--button-active);
  transform: scale(0.96);
}

.restart-button:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

/* Secondary to New Game, so it takes the board's muted brown rather than the
   button brown. Injected by theme.js — absent in hosts that own the theme. */
.theme-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: var(--board-bg);
  color: var(--ink-light);
  cursor: pointer;
  transition: background-color 160ms ease, color 240ms ease, transform 120ms var(--slide-ease);
}

.theme-toggle:active {
  transform: scale(0.94);
}

.theme-toggle:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}

.theme-toggle svg {
  width: 21px;
  height: 21px;
  display: block;
}

/* Cross-fade the surfaces when the theme flips, so the switch reads as the
   lights going down rather than as a page reload. Tiles are excluded: the
   actuator recreates them every move, so a colour transition there would never
   have an old value to animate from. */
body,
.game-container,
.grid-cell,
.score-container,
.best-container {
  transition-property: background-color, color;
  transition-duration: 240ms;
  transition-timing-function: ease;
}

/* ---- board ---- */

.game-container {
  position: relative;
  box-sizing: border-box;
  width: var(--board);
  height: var(--board);
  border-radius: var(--radius-board);
  background: var(--board-bg);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.grid-container,
.tile-container,
.fx-layer {
  position: absolute;
  inset: 0;
}

.grid-container {
  z-index: 1;
}

.tile-container {
  z-index: 2;
}

/* Merge particles. Above the tiles, never in the way of a swipe. */
.fx-layer {
  z-index: 3;
  width: 100%;
  height: 100%;
  border-radius: var(--radius-board);
  pointer-events: none;
}

.grid-cell {
  position: absolute;
  width: 21.25%;
  height: 21.25%;
  border-radius: var(--radius);
  background: var(--cell-empty);
}

.grid-cell[data-col="1"] { left: 3%; }
.grid-cell[data-col="2"] { left: 27.25%; }
.grid-cell[data-col="3"] { left: 51.5%; }
.grid-cell[data-col="4"] { left: 75.75%; }

.grid-cell[data-row="1"] { top: 3%; }
.grid-cell[data-row="2"] { top: 27.25%; }
.grid-cell[data-row="3"] { top: 51.5%; }
.grid-cell[data-row="4"] { top: 75.75%; }

/* ---- tiles ---- */

.tile {
  position: absolute;
  top: 0;
  left: 0;
  width: 21.25%;
  height: 21.25%;
  transition: transform var(--slide) var(--slide-ease);
  will-change: transform; /* keep all 16 on their own compositor layers */
}

.tile .tile-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  border-radius: var(--radius);
  /* Each tile class sets --c to its own colour; background and glow both read
     from it, so a tile's hue lives in exactly one place. */
  background: var(--c, var(--t2));
  color: var(--tile-ink);
  font-size: calc(var(--cell) * 0.52);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* Position stops — derivation in the file header. */
.tile.tile-position-1-1 { transform: translate(14.1176%, 14.1176%); }
.tile.tile-position-1-2 { transform: translate(14.1176%, 128.2353%); }
.tile.tile-position-1-3 { transform: translate(14.1176%, 242.3529%); }
.tile.tile-position-1-4 { transform: translate(14.1176%, 356.4706%); }
.tile.tile-position-2-1 { transform: translate(128.2353%, 14.1176%); }
.tile.tile-position-2-2 { transform: translate(128.2353%, 128.2353%); }
.tile.tile-position-2-3 { transform: translate(128.2353%, 242.3529%); }
.tile.tile-position-2-4 { transform: translate(128.2353%, 356.4706%); }
.tile.tile-position-3-1 { transform: translate(242.3529%, 14.1176%); }
.tile.tile-position-3-2 { transform: translate(242.3529%, 128.2353%); }
.tile.tile-position-3-3 { transform: translate(242.3529%, 242.3529%); }
.tile.tile-position-3-4 { transform: translate(242.3529%, 356.4706%); }
.tile.tile-position-4-1 { transform: translate(356.4706%, 14.1176%); }
.tile.tile-position-4-2 { transform: translate(356.4706%, 128.2353%); }
.tile.tile-position-4-3 { transform: translate(356.4706%, 242.3529%); }
.tile.tile-position-4-4 { transform: translate(356.4706%, 356.4706%); }

.tile-2 .tile-inner    { --c: var(--t2); }
.tile-4 .tile-inner    { --c: var(--t4); }
.tile-8 .tile-inner    { --c: var(--t8); }
.tile-16 .tile-inner   { --c: var(--t16); }
.tile-32 .tile-inner   { --c: var(--t32); }
.tile-64 .tile-inner   { --c: var(--t64); }
.tile-128 .tile-inner  { --c: var(--t128); }
.tile-256 .tile-inner  { --c: var(--t256); }
.tile-512 .tile-inner  { --c: var(--t512); }
.tile-1024 .tile-inner { --c: var(--t1024); }
.tile-2048 .tile-inner { --c: var(--t2048); }

/* Numerals shrink as the digits multiply. */
.tile-128 .tile-inner,
.tile-256 .tile-inner,
.tile-512 .tile-inner  { font-size: calc(var(--cell) * 0.42); }

.tile-1024 .tile-inner,
.tile-2048 .tile-inner { font-size: calc(var(--cell) * 0.34); }

/* The bloom takes the tile's own colour rather than a fixed gold, so a green
   256 glows green and the red 2048 glows red. It also strengthens up the ramp,
   which is what made the original's high tiles feel like a reward. */
.tile-128 .tile-inner {
  box-shadow: 0 0 30px 10px color-mix(in srgb, var(--c) 22%, transparent),
              inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}

.tile-256 .tile-inner {
  box-shadow: 0 0 30px 10px color-mix(in srgb, var(--c) 28%, transparent),
              inset 0 0 0 1px rgba(255, 255, 255, 0.19);
}

.tile-512 .tile-inner {
  box-shadow: 0 0 30px 10px color-mix(in srgb, var(--c) 34%, transparent),
              inset 0 0 0 1px rgba(255, 255, 255, 0.24);
}

.tile-1024 .tile-inner {
  box-shadow: 0 0 30px 10px color-mix(in srgb, var(--c) 40%, transparent),
              inset 0 0 0 1px rgba(255, 255, 255, 0.29);
}

.tile-2048 .tile-inner {
  box-shadow: 0 0 30px 10px color-mix(in srgb, var(--c) 48%, transparent),
              inset 0 0 0 1px rgba(255, 255, 255, 0.33);
}

/* Past 2048 the ramp has nowhere warmer to go, so the tile drops out of it
   entirely — near-black, the one value the gradient never visits. */
.tile-super .tile-inner {
  --c: var(--tsuper);
  color: var(--ink-light);
  font-size: calc(var(--cell) * 0.29);
}

/* The panel reports HDR headroom, so let the top of the ramp use it: the bloom
   goes wider and hotter than an SDR screen could show. */
@media (dynamic-range: high) {
  .tile-512 .tile-inner,
  .tile-1024 .tile-inner,
  .tile-2048 .tile-inner {
    box-shadow: 0 0 44px 14px color-mix(in srgb, var(--c) 52%, transparent),
                inset 0 0 0 1px rgba(255, 255, 255, 0.34);
  }
}

.tile-new .tile-inner {
  animation: appear 160ms var(--slide-ease) 60ms;
  animation-fill-mode: backwards;
}

@keyframes appear {
  0% {
    opacity: 0;
    transform: scale(0.2);
  }
  100% {
    opacity: 1;

/* ---- js/bind_polyfill.js ---- */
Function.prototype.bind = Function.prototype.bind || function (target) {
  var self = this;
  return function (args) {

      args = [args];
    }
    self.apply(target, args);

/* ---- js/classlist_polyfill.js ---- */
(function () {
  if (typeof window.Element === "undefined" ||
      "classList" in document.documentElement) {
    return;
  }

  var prototype = Array.prototype,
      push = prototype.push,
      splice = prototype.splice,
      join = prototype.join;

  function DOMTokenList(el) {
    this.el = el;
    // The className needs to be trimmed and split on whitespace
    // to retrieve a list of classes.
    var classes = el.className.replace(/^\s+|\s+$/g, '').split(/\s+/);
    for (var i = 0; i < classes.length; i++) {
      push.call(this, classes[i]);
    }
  }

  DOMTokenList.prototype = {
    add: function (token) {
      if (this.contains(token)) return;
      push.call(this, token);
      this.el.className = this.toString();
    },
    contains: function (token) {
      return this.el.className.indexOf(token) != -1;
    },
    item: function (index) {
      return this[index] || null;
    },
    remove: function (token) {
      if (!this.contains(token)) return;
      for (var i = 0; i < this.length; i++) {
        if (this[i] == token) break;
      }
      splice.call(this, i, 1);
      this.el.className = this.toString();
    },
    toString: function () {
      return join.call(this, ' ');
    },
    toggle: function (token) {
      if (!this.contains(token)) {
        this.add(token);
      } else {
        this.remove(token);
      }

      return this.contains(token);
    }
  };

  window.DOMTokenList = DOMTokenList;

  function defineElementGetter(obj, prop, getter) {
    if (Object.defineProperty) {
      Object.defineProperty(obj, prop, {
        get: getter
      });
    } else {
      obj.__defineGetter__(prop, getter);
    }
  }

  defineElementGetter(HTMLElement.prototype, 'classList', function () {
    return new DOMTokenList(this);
  });

/* ---- js/animframe_polyfill.js ---- */
(function () {

      var timeToCall = Math.max(0, 16 - (currTime - lastTime));

/* ---- js/input_manager.js ---- */
/* Input manager — phone variant.
 *
 * Keeps upstream's constructor name and its on("move"|"restart"|"keepPlaying")
 * interface, so game_manager.js and application.js are used unmodified.
 *
 * Three changes from upstream:
 *   1. Swipes are read on the whole document, not just the board. On a phone
 *      the board is a small target and a swipe that starts on the heading or
 *      the margin should still move tiles.
 *   2. Buttons bind "click" only. Upstream binds click AND touchend, so one tap
 *      fires the handler twice — on a win screen that restarted the game and
 *      immediately dismissed the message.
 *   3. Pointer events handle mouse-drag and stylus too, with touch events kept
 *      as the fallback path.
 */

function KeyboardInputManager() {
  this.events = {};

  // Distance a gesture must cover before it counts as a swipe rather than a tap.
  // Upstream uses 10px, which misreads a slightly smudged tap as a move.
  this.swipeThreshold = 20;

  this.listen();
}

KeyboardInputManager.prototype.on = function (event, callback) {
  if (!this.events[event]) {
    this.events[event] = [];
  }
  this.events[event].push(callback);
};

KeyboardInputManager.prototype.emit = function (event, data) {
  var callbacks = this.events[event];
  if (callbacks) {
    callbacks.forEach(function (callback) {
      callback(data);
    });
  }
};

// A gesture starting on a control is that control's tap, not a board swipe.
// Text fields count: the leaderboard's name entry lives on the same page.
KeyboardInputManager.prototype.isControl = function (target) {
  return !!(target && target.closest &&
            target.closest("a, button, input, textarea, select"));
};

KeyboardInputManager.prototype.listen = function () {
  var self = this;

  var map = {
    38: 0, // Up
    39: 1, // Right
    40: 2, // Down
    37: 3, // Left
    75: 0, // Vim up
    76: 1, // Vim right
    74: 2, // Vim down
    72: 3, // Vim left
    87: 0, // W
    68: 1, // D
    83: 2, // S
    65: 3  // A
  };

  document.addEventListener("keydown", function (event) {
    var modifiers = event.altKey || event.ctrlKey || event.metaKey ||
                    event.shiftKey;
    var mapped    = map[event.which];

    if (!modifiers) {
      if (mapped !== undefined) {
        event.preventDefault();
        self.emit("move", mapped);
      }

      // R restarts, with the same two-press confirmation as the button
      if (event.which === 82) {
        self.confirmRestart.call(self, event);
      }
    }
  });

  this.bindButtonPress(".retry-button", this.restart);
  this.bindButtonPress(".restart-button", this.confirmRestart);
  this.bindButtonPress(".keep-playing-button", this.keepPlaying);

  var startX = null;
  var startY = null;
  var tracking = false;

  function begin(x, y, target) {
    if (self.isControl(target)) {
      tracking = false;
      return;
    }
    startX = x;
    startY = y;
    tracking = true;
  }

  function finish(x, y) {
    if (!tracking) return;
    tracking = false;

    var dx = x - startX;
    var dy = y - startY;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) > self.swipeThreshold) {
      self.disarmRestart(); // playing on means the first tap was a slip
      // (right : left) : (down : up)
      self.emit("move", absDx > absDy ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    }
  }

  if (window.PointerEvent) {
    document.addEventListener("pointerdown", function (event) {
      if (!event.isPrimary) return;
      begin(event.clientX, event.clientY, event.target);
    });

    document.addEventListener("pointerup", function (event) {
      if (!event.isPrimary) return;
      finish(event.clientX, event.clientY);
    });

    document.addEventListener("pointercancel", function () {
      tracking = false;
    });
  } else {
    document.addEventListener("touchstart", function (event) {
      if (event.touches.length > 1) {
        tracking = false; // multi-touch is a pinch, not a swipe
        return;
      }
      begin(event.touches[0].clientX, event.touches[0].clientY, event.target);
    }, { passive: true });

    document.addEventListener("touchend", function (event) {
      if (event.touches.length > 0) return;
      finish(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
    });

    document.addEventListener("touchcancel", function () {
      tracking = false;
    });
  }

  // touch-action:none in the stylesheet stops the browser scrolling or zooming
  // on these gestures; this stops the rubber-band on engines that ignore it.
  document.addEventListener("touchmove", function (event) {
    if (tracking) event.preventDefault();
  }, { passive: false });
};

KeyboardInputManager.prototype.restart = function (event) {
  event.preventDefault();
  this.emit("restart");
};

/* New Game asks twice. The first press turns the button into "Tap again" for
 * a few seconds; only a second press inside that window restarts. There is no
 * dialog to dismiss, and letting it lapse or swiping cancels it.
 *
 * It skips the question when there is nothing to lose: after game over (the
 * board is already finished) or before the first point is scored. The overlay's
 * "Try again" button never asks, for the same reason. */
KeyboardInputManager.prototype.restartArmMs = 3000;

KeyboardInputManager.prototype.hasProgress = function () {
  var over = document.querySelector(".game-message.game-over");
  if (over) return false;
  var score = document.querySelector(".score-container");
  return !!score && (parseInt(score.textContent, 10) || 0) > 0;
};

KeyboardInputManager.prototype.confirmRestart = function (event) {
  event.preventDefault();

  if (this.restartArmed || !this.hasProgress()) {
    this.disarmRestart();
    this.emit("restart");
    return;
  }

  var button = document.querySelector(".restart-button");
  this.restartArmed = true;
  if (button) {
    button.style.minWidth = button.offsetWidth + "px"; // no layout jump
    this.restartLabel = button.textContent;
    button.textContent = "Tap again";
    button.classList.add("is-armed");
  }
  this.restartTimer = setTimeout(this.disarmRestart.bind(this), this.restartArmMs);
};

KeyboardInputManager.prototype.disarmRestart = function () {
  if (!this.restartArmed) return;
  this.restartArmed = false;
  clearTimeout(this.restartTimer);
  var button = document.querySelector(".restart-button");
  if (button) {
    button.textContent = this.restartLabel;
    button.classList.remove("is-armed");
    button.style.minWidth = "";
  }
};

KeyboardInputManager.prototype.keepPlaying = function (event) {
  event.preventDefault();
  this.emit("keepPlaying");
};

KeyboardInputManager.prototype.bindButtonPress = function (selector, fn) {
  var button = document.querySelector(selector);
  if (!button) return;
  button.addEventListener("click", fn.bind(this));
};

/* ---- js/html_actuator.js ---- */
function HTMLActuator() {
  this.tileContainer    = document.querySelector(".tile-container");
  this.scoreContainer   = document.querySelector(".score-container");
  this.bestContainer    = document.querySelector(".best-container");
  this.messageContainer = document.querySelector(".game-message");

  this.score = 0;
}

HTMLActuator.prototype.actuate = function (grid, metadata) {
  var self = this;

  window.requestAnimationFrame(function () {
    self.clearContainer(self.tileContainer);

    grid.cells.forEach(function (column) {
      column.forEach(function (cell) {
        if (cell) {
          self.addTile(cell);
        }
      });
    });

    self.updateScore(metadata.score);
    self.updateBestScore(metadata.bestScore);

    if (metadata.terminated) {
      if (metadata.over) {
        self.message(false); // You lose
      } else if (metadata.won) {
        self.message(true); // You win!
      }
    }

  });
};

// Continues the game (both restart and keep playing)
HTMLActuator.prototype.continueGame = function () {
  this.clearMessage();
};

HTMLActuator.prototype.clearContainer = function (container) {
  while (container.firstChild) {
    container.removeChild(container.firstChild);
  }
};

HTMLActuator.prototype.addTile = function (tile) {
  var self = this;

  var wrapper   = document.createElement("div");
  var inner     = document.createElement("div");
  var position  = tile.previousPosition || { x: tile.x, y: tile.y };
  var positionClass = this.positionClass(position);

  // We can't use classlist because it somehow glitches when replacing classes
  var classes = ["tile", "tile-" + tile.value, positionClass];

  if (tile.value > 2048) classes.push("tile-super");

  this.applyClasses(wrapper, classes);

  inner.classList.add("tile-inner");
  inner.textContent = tile.value;

  if (tile.previousPosition) {
    // Make sure that the tile gets rendered in the previous position first
    window.requestAnimationFrame(function () {
      classes[2] = self.positionClass({ x: tile.x, y: tile.y });
      self.applyClasses(wrapper, classes); // Update the position
    });
  } else if (tile.mergedFrom) {
    classes.push("tile-merged");
    this.applyClasses(wrapper, classes);

    // Render the tiles that merged
    tile.mergedFrom.forEach(function (merged) {
      self.addTile(merged);
    });
  } else {
    classes.push("tile-new");
    this.applyClasses(wrapper, classes);
  }

  // Add the inner part of the tile to the wrapper
  wrapper.appendChild(inner);

  // Put the tile on the board
  this.tileContainer.appendChild(wrapper);
};

HTMLActuator.prototype.applyClasses = function (element, classes) {
  element.setAttribute("class", classes.join(" "));
};

HTMLActuator.prototype.normalizePosition = function (position) {
  return { x: position.x + 1, y: position.y + 1 };
};

HTMLActuator.prototype.positionClass = function (position) {
  position = this.normalizePosition(position);
  return "tile-position-" + position.x + "-" + position.y;
};

HTMLActuator.prototype.updateScore = function (score) {
  this.clearContainer(this.scoreContainer);

  var difference = score - this.score;
  this.score = score;

  this.scoreContainer.textContent = this.score;

  if (difference > 0) {
    var addition = document.createElement("div");
    addition.classList.add("score-addition");
    addition.textContent = "+" + difference;

    this.scoreContainer.appendChild(addition);
  }
};

HTMLActuator.prototype.updateBestScore = function (bestScore) {
  this.bestContainer.textContent = bestScore;
};

HTMLActuator.prototype.message = function (won) {
  var type    = won ? "game-won" : "game-over";
  var message = won ? "You win!" : "Game over!";

  this.messageContainer.classList.add(type);
  this.messageContainer.getElementsByTagName("p")[0].textContent = message;
};

HTMLActuator.prototype.clearMessage = function () {
  // IE only takes one value to remove at a time.
  this.messageContainer.classList.remove("game-won");
  this.messageContainer.classList.remove("game-over");
};

/* ---- js/grid.js ---- */
function Grid(size, previousState) {
  this.size = size;
  this.cells = previousState ? this.fromState(previousState) : this.empty();
}

// Build a grid of the specified size
Grid.prototype.empty = function () {
  var cells = [];

  for (var x = 0; x < this.size; x++) {
    var row = cells[x] = [];

    for (var y = 0; y < this.size; y++) {
      row.push(null);
    }
  }

  return cells;
};

Grid.prototype.fromState = function (state) {
  var cells = [];

  for (var x = 0; x < this.size; x++) {
    var row = cells[x] = [];

    for (var y = 0; y < this.size; y++) {
      var tile = state[x][y];
      row.push(tile ? new Tile(tile.position, tile.value) : null);
    }
  }

  return cells;
};

// Find the first available random position
Grid.prototype.randomAvailableCell = function () {
  var cells = this.availableCells();

  if (cells.length) {
    return cells[Math.floor(Math.random() * cells.length)];
  }
};

Grid.prototype.availableCells = function () {
  var cells = [];

  this.eachCell(function (x, y, tile) {
    if (!tile) {
      cells.push({ x: x, y: y });
    }
  });

  return cells;
};

// Call callback for every cell
Grid.prototype.eachCell = function (callback) {
  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {
      callback(x, y, this.cells[x][y]);
    }
  }
};

// Check if there are any cells available
Grid.prototype.cellsAvailable = function () {
  return !!this.availableCells().length;
};

// Check if the specified cell is taken
Grid.prototype.cellAvailable = function (cell) {
  return !this.cellOccupied(cell);
};

Grid.prototype.cellOccupied = function (cell) {
  return !!this.cellContent(cell);
};

Grid.prototype.cellContent = function (cell) {
  if (this.withinBounds(cell)) {
    return this.cells[cell.x][cell.y];
  } else {
    return null;
  }
};

// Inserts a tile at its position
Grid.prototype.insertTile = function (tile) {
  this.cells[tile.x][tile.y] = tile;
};

Grid.prototype.removeTile = function (tile) {
  this.cells[tile.x][tile.y] = null;
};

Grid.prototype.withinBounds = function (position) {
  return position.x >= 0 && position.x < this.size &&
         position.y >= 0 && position.y < this.size;
};

Grid.prototype.serialize = function () {
  var cellState = [];

  for (var x = 0; x < this.size; x++) {
    var row = cellState[x] = [];

    for (var y = 0; y < this.size; y++) {
      row.push(this.cells[x][y] ? this.cells[x][y].serialize() : null);
    }
  }

  return {
    size: this.size,
    cells: cellState
  };
};

/* ---- js/tile.js ---- */
function Tile(position, value) {
  this.x                = position.x;
  this.y                = position.y;
  this.value            = value || 2;

  this.previousPosition = null;
  this.mergedFrom       = null; // Tracks tiles that merged together
}

Tile.prototype.savePosition = function () {
  this.previousPosition = { x: this.x, y: this.y };
};

Tile.prototype.updatePosition = function (position) {
  this.x = position.x;
  this.y = position.y;
};

Tile.prototype.serialize = function () {
  return {
    position: {
      x: this.x,
      y: this.y
    },
    value: this.value
  };
};

/* ---- js/local_storage_manager.js ---- */
window.fakeStorage = {
  _data: {},

  setItem: function (id, val) {
    return this._data[id] = String(val);
  },

  getItem: function (id) {
    return this._data.hasOwnProperty(id) ? this._data[id] : undefined;
  },

  removeItem: function (id) {
    return delete this._data[id];
  },

  clear: function () {
    return this._data = {};
  }
};

function LocalStorageManager() {
  this.bestScoreKey     = "bestScore";
  this.gameStateKey     = "gameState";

  var supported = this.localStorageSupported();
  this.storage = supported ? window.localStorage : window.fakeStorage;
}

LocalStorageManager.prototype.localStorageSupported = function () {
  var testKey = "test";

  try {
    var storage = window.localStorage;
    storage.setItem(testKey, "1");
    storage.removeItem(testKey);
    return true;
  } catch (error) {
    return false;
  }
};

// Best score getters/setters
LocalStorageManager.prototype.getBestScore = function () {
  return this.storage.getItem(this.bestScoreKey) || 0;
};

LocalStorageManager.prototype.setBestScore = function (score) {
  this.storage.setItem(this.bestScoreKey, score);
};

// Game state getters/setters and clearing
LocalStorageManager.prototype.getGameState = function () {
  var stateJSON = this.storage.getItem(this.gameStateKey);
  return stateJSON ? JSON.parse(stateJSON) : null;
};

LocalStorageManager.prototype.setGameState = function (gameState) {
  this.storage.setItem(this.gameStateKey, JSON.stringify(gameState));
};

LocalStorageManager.prototype.clearGameState = function () {
  this.storage.removeItem(this.gameStateKey);
};

/* ---- js/game_manager.js ---- */
function GameManager(size, InputManager, Actuator, StorageManager) {
  this.size           = size; // Size of the grid
  this.inputManager   = new InputManager;
  this.storageManager = new StorageManager;
  this.actuator       = new Actuator;

  this.startTiles     = 2;

  this.inputManager.on("move", this.move.bind(this));
  this.inputManager.on("restart", this.restart.bind(this));
  this.inputManager.on("keepPlaying", this.keepPlaying.bind(this));

  this.setup();
}

// Restart the game
GameManager.prototype.restart = function () {
  this.storageManager.clearGameState();
  this.actuator.continueGame(); // Clear the game won/lost message
  this.setup();
};

// Keep playing after winning (allows going over 2048)
GameManager.prototype.keepPlaying = function () {
  this.keepPlaying = true;
  this.actuator.continueGame(); // Clear the game won/lost message
};

// Return true if the game is lost, or has won and the user hasn't kept playing
GameManager.prototype.isGameTerminated = function () {
  return this.over || (this.won && !this.keepPlaying);
};

// Set up the game
GameManager.prototype.setup = function () {
  var previousState = this.storageManager.getGameState();

  // Reload the game from a previous game if present
  if (previousState) {
    this.grid        = new Grid(previousState.grid.size,
                                previousState.grid.cells); // Reload grid
    this.score       = previousState.score;
    this.over        = previousState.over;
    this.won         = previousState.won;
    this.keepPlaying = previousState.keepPlaying;
  } else {
    this.grid        = new Grid(this.size);
    this.score       = 0;
    this.over        = false;
    this.won         = false;
    this.keepPlaying = false;

    // Add the initial tiles
    this.addStartTiles();
  }

  // Update the actuator
  this.actuate();
};

// Set up the initial tiles to start the game with
GameManager.prototype.addStartTiles = function () {
  for (var i = 0; i < this.startTiles; i++) {
    this.addRandomTile();
  }
};

// Adds a tile in a random position
GameManager.prototype.addRandomTile = function () {
  if (this.grid.cellsAvailable()) {
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile = new Tile(this.grid.randomAvailableCell(), value);

    this.grid.insertTile(tile);
  }
};

// Sends the updated grid to the actuator
GameManager.prototype.actuate = function () {
  if (this.storageManager.getBestScore() < this.score) {
    this.storageManager.setBestScore(this.score);
  }

  // Clear the state when the game is over (game over only, not win)
  if (this.over) {
    this.storageManager.clearGameState();
  } else {
    this.storageManager.setGameState(this.serialize());
  }

  this.actuator.actuate(this.grid, {
    score:      this.score,
    over:       this.over,
    won:        this.won,
    bestScore:  this.storageManager.getBestScore(),
    terminated: this.isGameTerminated()
  });

};

// Represent the current game as an object
GameManager.prototype.serialize = function () {
  return {
    grid:        this.grid.serialize(),
    score:       this.score,
    over:        this.over,
    won:         this.won,
    keepPlaying: this.keepPlaying
  };
};

// Save all tile positions and remove merger info
GameManager.prototype.prepareTiles = function () {
  this.grid.eachCell(function (x, y, tile) {
    if (tile) {
      tile.mergedFrom = null;
      tile.savePosition();
    }
  });
};

// Move a tile and its representation
GameManager.prototype.moveTile = function (tile, cell) {
  this.grid.cells[tile.x][tile.y] = null;
  this.grid.cells[cell.x][cell.y] = tile;
  tile.updatePosition(cell);
};

// Move tiles on the grid in the specified direction
GameManager.prototype.move = function (direction) {
  // 0: up, 1: right, 2: down, 3: left
  var self = this;

  if (this.isGameTerminated()) return; // Don't do anything if the game's over

  var cell, tile;

  var vector     = this.getVector(direction);
  var traversals = this.buildTraversals(vector);
  var moved      = false;

  // Save the current tile positions and remove merger information
  this.prepareTiles();

  // Traverse the grid in the right direction and move tiles
  traversals.x.forEach(function (x) {
    traversals.y.forEach(function (y) {
      cell = { x: x, y: y };
      tile = self.grid.cellContent(cell);

      if (tile) {
        var positions = self.findFarthestPosition(cell, vector);
        var next      = self.grid.cellContent(positions.next);

        // Only one merger per row traversal?
        if (next && next.value === tile.value && !next.mergedFrom) {
          var merged = new Tile(positions.next, tile.value * 2);
          merged.mergedFrom = [tile, next];

          self.grid.insertTile(merged);
          self.grid.removeTile(tile);

          // Converge the two tiles' positions
          tile.updatePosition(positions.next);

          // Update the score
          self.score += merged.value;

          // The mighty 2048 tile
          if (merged.value === 2048) self.won = true;
        } else {
          self.moveTile(tile, positions.farthest);
        }

        if (!self.positionsEqual(cell, tile)) {
          moved = true; // The tile moved from its original cell!
        }
      }
    });
  });

  if (moved) {
    this.addRandomTile();

    if (!this.movesAvailable()) {
      this.over = true; // Game over!
    }

    this.actuate();
  }
};

// Get the vector representing the chosen direction
GameManager.prototype.getVector = function (direction) {
  // Vectors representing tile movement
  var map = {
    0: { x: 0,  y: -1 }, // Up
    1: { x: 1,  y: 0 },  // Right
    2: { x: 0,  y: 1 },  // Down
    3: { x: -1, y: 0 }   // Left
  };

  return map[direction];
};

// Build a list of positions to traverse in the right order
GameManager.prototype.buildTraversals = function (vector) {
  var traversals = { x: [], y: [] };

  for (var pos = 0; pos < this.size; pos++) {
    traversals.x.push(pos);
    traversals.y.push(pos);
  }

  // Always traverse from the farthest cell in the chosen direction
  if (vector.x === 1) traversals.x = traversals.x.reverse();
  if (vector.y === 1) traversals.y = traversals.y.reverse();

  return traversals;
};

GameManager.prototype.findFarthestPosition = function (cell, vector) {
  var previous;

  // Progress towards the vector direction until an obstacle is found
  do {
    previous = cell;
    cell     = { x: previous.x + vector.x, y: previous.y + vector.y };
  } while (this.grid.withinBounds(cell) &&
           this.grid.cellAvailable(cell));

  return {
    farthest: previous,
    next: cell // Used to check if a merge is required
  };
};

GameManager.prototype.movesAvailable = function () {
  return this.grid.cellsAvailable() || this.tileMatchesAvailable();
};

// Check for available matches between tiles (more expensive check)
GameManager.prototype.tileMatchesAvailable = function () {
  var self = this;

  var tile;

  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {
      tile = this.grid.cellContent({ x: x, y: y });

      if (tile) {
        for (var direction = 0; direction < 4; direction++) {
          var vector = self.getVector(direction);
          var cell   = { x: x + vector.x, y: y + vector.y };

          var other  = self.grid.cellContent(cell);

          if (other && other.value === tile.value) {
            return true; // These two tiles can be merged
          }
        }
      }
    }
  }

  return false;
};

GameManager.prototype.positionsEqual = function (first, second) {
  return first.x === second.x && first.y === second.y;
};

/* ---- js/palette.js ---- */
/* Tile palette switch — the custom gradient, or upstream's original.
 *
 * Stamps data-palette="original" on the root element; the stylesheet does the
 * rest. Lives in the footer rather than beside New Game: it is a preference you
 * set once, not a control you reach for mid-game, and the action row has no
 * space left at 412px.
 *
 * Unlike theme.js this ships everywhere, including the single-file bundle. A
 * host may own the page's light/dark theme, but nothing outside the game has an
 * opinion about which tile ramp it uses.
 */

(function () {
  "use strict";

  var KEY = "2048-palette";

  function stored() {
    try {
      return localStorage.getItem(KEY) === "original" ? "original" : "custom";
    } catch (e) {
      return "custom"; // private window, or site data blocked
    }
  }

  function store(value) {
    try {
      if (value === "original") {
        localStorage.setItem(KEY, value);
      } else {
        localStorage.removeItem(KEY);
      }
    } catch (e) {
      /* the switch still works for this session, it just will not persist */
    }
  }

  function apply(value) {
    if (value === "original") {
      document.documentElement.setAttribute("data-palette", "original");
    } else {
      document.documentElement.removeAttribute("data-palette");
    }
  }

  function init() {
    var current = stored();
    apply(current);

    var footer = document.querySelector(".game-explanation");
    if (!footer || !footer.parentNode) return;

    var wrap = document.createElement("div");
    wrap.className = "palette-switch";

    var label = document.createElement("span");
    label.className = "palette-label";
    label.id = "palette-label";
    label.textContent = "Tiles";

    var group = document.createElement("div");
    group.className = "seg";
    group.setAttribute("role", "group");
    group.setAttribute("aria-labelledby", "palette-label");

    var buttons = {};

    ["custom", "original"].forEach(function (name) {
      var button = document.createElement("button");
      button.type = "button";
      button.id = "palette-" + name;
      button.textContent = name === "custom" ? "Custom" : "Original";
      button.addEventListener("click", function () {
        if (current === name) return;
        current = name;
        store(name);
        apply(name);
        render();
        try {
          if (navigator.vibrate) navigator.vibrate(8);
        } catch (e) {
          /* haptics off */
        }
      });
      buttons[name] = button;
      group.appendChild(button);
    });

    function render() {
      Object.keys(buttons).forEach(function (name) {
        buttons[name].setAttribute("aria-pressed", String(current === name));
      });
    }

    render();
    wrap.appendChild(label);
    wrap.appendChild(group);
    footer.parentNode.insertBefore(wrap, footer.nextSibling);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

/* ---- js/effects.js ---- */
/* Merge effects — Pixel 11 build.
 *
 * Two things this device does well that a generic build cannot assume:
 *
 *   Wide gamut. The canvas is created with colorSpace "display-p3" and particles
 *   take their colour straight from the tile's CSS custom property, so a spark
 *   thrown off a 512 is the same out-of-sRGB gold as the tile it came from
 *   rather than a clipped approximation of it.
 *
 *   Headroom. Tensor G6 at 120Hz will not notice a few hundred sprites, so the
 *   burst scales with the value merged: a 4 gets a flicker, a 1024 gets a shower
 *   and a shockwave ring. The loop is delta-timed, so it runs at the same speed
 *   whether the panel is at 60Hz or 120Hz, and it parks itself the moment the
 *   last particle dies rather than holding the display at high refresh.
 *
 * Attaches by wrapping HTMLActuator.actuate, so upstream's actuator is used
 * verbatim.
 */

(function () {
  "use strict";

  var GRAVITY = 900;      // px/s^2, enough that sparks arc instead of floating
  var DRAG = 0.86;        // per-second velocity retention
  var MAX_PARTICLES = 600;

  function Effects(boardEl) {
    this.board = boardEl;
    this.particles = [];
    this.rings = [];
    this.running = false;
    this.lastTime = 0;
    this.size = 0;

    this.canvas = document.createElement("canvas");
    this.canvas.className = "fx-layer";
    this.canvas.setAttribute("aria-hidden", "true");
    boardEl.appendChild(this.canvas);

    // display-p3 backing store where available; Chrome on this panel has it.
    try {
      this.ctx = this.canvas.getContext("2d", { colorSpace: "display-p3" });
    } catch (e) {
      this.ctx = null;
    }
    if (!this.ctx) this.ctx = this.canvas.getContext("2d");

    this.resize();

    var self = this;
    if (window.ResizeObserver) {
      new ResizeObserver(function () { self.resize(); }).observe(boardEl);
    } else {
      window.addEventListener("resize", function () { self.resize(); });
    }
  }

  Effects.prototype.resize = function () {
    var rect = this.board.getBoundingClientRect();
    if (!rect.width) return;

    // Cap the ratio: past 3x the extra pixels cost fill rate and buy nothing.
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.size = rect.width;
    this.canvas.width = Math.round(rect.width * dpr);
    this.canvas.height = Math.round(rect.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  // Centre of grid cell (x, y), both 0-indexed, in board CSS px.
  Effects.prototype.cellCenter = function (x, y) {
    var b = this.size;
    return {
      x: (0.03 + x * 0.2425 + 0.10625) * b,
      y: (0.03 + y * 0.2425 + 0.10625) * b
    };
  };

  Effects.prototype.tileColor = function (value) {
    var name = value > 2048 ? "--tsuper" : "--t" + value;
    var css = getComputedStyle(document.documentElement)
      .getPropertyValue(name)
      .trim();
    return css || "#edc22e";
  };

  Effects.prototype.burst = function (tile) {
    if (!this.size) this.resize();
    if (!this.size) return;

    var center = this.cellCenter(tile.x, tile.y);
    var exponent = Math.round(Math.log(tile.value) / Math.LN2); // 4 -> 2, 2048 -> 11
    var count = Math.min(6 + exponent * 4, 52);
    var color = this.tileColor(tile.value);
    var cell = this.size * 0.2125;
    var speed = cell * (1.4 + exponent * 0.16);

    for (var i = 0; i < count; i++) {
      if (this.particles.length >= MAX_PARTICLES) break;

      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      var velocity = speed * (0.45 + Math.random() * 0.75);

      this.particles.push({
        x: center.x + Math.cos(angle) * cell * 0.16,
        y: center.y + Math.sin(angle) * cell * 0.16,
        vx: Math.cos(angle) * velocity,
        vy: Math.sin(angle) * velocity - cell * 0.5,
        radius: cell * (0.018 + Math.random() * 0.042),
        life: 0,
        ttl: 0.34 + Math.random() * 0.34,
        color: color
      });
    }

    // Big merges also throw a ring. Below 128 it would just be visual noise.
    if (tile.value >= 128) {
      this.rings.push({
        x: center.x,
        y: center.y,
        life: 0,
        ttl: 0.42,
        from: cell * 0.3,
        to: cell * (0.95 + exponent * 0.1),
        color: color
      });
    }

    this.start();
  };

  Effects.prototype.start = function () {
    if (this.running) return;
    this.running = true;
    this.lastTime = 0;

    var self = this;
    window.requestAnimationFrame(function step(now) {
      // Delta-timed: identical motion at 60Hz and 120Hz.
      var dt = self.lastTime ? Math.min((now - self.lastTime) / 1000, 0.05) : 0.016;
      self.lastTime = now;

      self.update(dt);
      self.draw();

      if (self.particles.length || self.rings.length) {
        window.requestAnimationFrame(step);
      } else {
        // Nothing left to draw: clear once and release the frame callback so the
        // panel can drop back to its idle refresh rate.
        self.ctx.clearRect(0, 0, self.size, self.size);
        self.running = false;
      }
    });
  };

  Effects.prototype.update = function (dt) {
    var drag = Math.pow(DRAG, dt);
    var i;

    for (i = this.particles.length - 1; i >= 0; i--) {
      var p = this.particles[i];
      p.life += dt;
      if (p.life >= p.ttl) {
        this.particles.splice(i, 1);
        continue;
      }
      p.vx *= drag;
      p.vy = p.vy * drag + GRAVITY * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (i = this.rings.length - 1; i >= 0; i--) {
      var r = this.rings[i];
      r.life += dt;
      if (r.life >= r.ttl) this.rings.splice(i, 1);
    }
  };

  Effects.prototype.draw = function () {
    var ctx = this.ctx;
    ctx.clearRect(0, 0, this.size, this.size);

    var i;

    for (i = 0; i < this.rings.length; i++) {
      var r = this.rings[i];
      var t = r.life / r.ttl;
      var eased = 1 - Math.pow(1 - t, 3);

      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = Math.max(1, this.size * 0.008 * (1 - t));
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.from + (r.to - r.from) * eased, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      var pt = p.life / p.ttl;

      ctx.globalAlpha = 1 - pt * pt;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * (1 - pt * 0.45), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  };

  /* ---- haptics ----
   * One pulse per move, not one per merge, so a four-way cascade is a single
   * crisp tick rather than a stutter. Kept in the 8-22ms range: long enough for
   * the Pixel's actuator to register as a tap, short enough never to buzz.
   */
  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) {
      /* user has haptics off, or the browser refuses outside a gesture */
    }
  }

  function init() {
    var board = document.querySelector(".game-container");
    if (!board || typeof HTMLActuator === "undefined") return;

    var reduced = window.matchMedia &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var effects = reduced ? null : new Effects(board);

    var actuate = HTMLActuator.prototype.actuate;
    HTMLActuator.prototype.actuate = function (grid, metadata) {
      actuate.call(this, grid, metadata);

      var merges = [];
      grid.cells.forEach(function (column) {
        column.forEach(function (cell) {
          if (cell && cell.mergedFrom) merges.push(cell);
        });
      });

      if (merges.length) {
        var largest = merges.reduce(function (a, b) {
          return a.value > b.value ? a : b;
        });
        var exponent = Math.round(Math.log(largest.value) / Math.LN2);
        vibrate(Math.min(6 + exponent * 1.5, 22));

        if (effects) {
          // Fire as the sliding tiles meet, so the sparks come out of the
          // collision rather than trailing behind the pop.
          window.setTimeout(function () {
            merges.forEach(function (tile) { effects.burst(tile); });
          }, 90);
        }
      }

      if (metadata.terminated) {
        vibrate(metadata.over && !metadata.won ? 34 : [14, 46, 14, 46, 28]);
      }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

/* ---- js/application.js ---- */
// Wait till the browser is ready to render the game (avoids glitches)
window.requestAnimationFrame(function () {
  new GameManager(4, KeyboardInputManager, HTMLActuator, LocalStorageManager);
});
</script>
