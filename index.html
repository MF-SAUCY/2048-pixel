<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <meta name="description" content="2048 — the original game by Gabriele Cirulli, ad-free and built to play on a phone.">

  <!-- viewport-fit=cover lets the page run under the notch; the safe-area
       insets below keep the content clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Two media-scoped values, so a browser tab gets the right one before any JS
       runs. An installed WebAPK ignores both: it bakes its status bar colour from
       the manifest at install time and will not repaint on a runtime change
       (crbug.com/40634649). A single manifest colour cannot match both a cream
       and a near-black ground, which is why the manifest asks for fullscreen and
       does away with the status bar instead. -->
  <meta name="theme-color" content="#faf8ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <script>
    // Applied before first paint so a stored night theme does not flash cream.
    try {
      if (localStorage.getItem("2048-palette") === "original") {
        document.documentElement.setAttribute("data-palette", "original");
      }
      var t = localStorage.getItem("2048-theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        // An explicit choice has to beat the media queries above. Writing the
        // same colour into both tags makes whichever one matches the right one.
        var c = t === "dark" ? "#14110e" : "#faf8ef";
        var m = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < m.length; i++) m[i].setAttribute("content", c);
      }
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="style/main.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- iOS still reads these rather than the manifest for home-screen launches. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2048">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* Clear the system bars when launched full-screen from the home screen. */
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">
      <div class="title-box">
        <h1 class="title">2048</h1>
      </div>
      <div class="heading-side">
        <div class="scores-container">
          <div class="score-container">0</div>
          <div class="best-container">0</div>
        </div>
        <div class="above-game">
          <a class="restart-button" href="#" role="button">New Game</a>
        </div>
      </div>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button" href="#" role="button">Keep going</a>
          <a class="retry-button" href="#" role="button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-cell" data-row="1" data-col="1"></div>
        <div class="grid-cell" data-row="1" data-col="2"></div>
        <div class="grid-cell" data-row="1" data-col="3"></div>
        <div class="grid-cell" data-row="1" data-col="4"></div>
        <div class="grid-cell" data-row="2" data-col="1"></div>
        <div class="grid-cell" data-row="2" data-col="2"></div>
        <div class="grid-cell" data-row="2" data-col="3"></div>
        <div class="grid-cell" data-row="2" data-col="4"></div>
        <div class="grid-cell" data-row="3" data-col="1"></div>
        <div class="grid-cell" data-row="3" data-col="2"></div>
        <div class="grid-cell" data-row="3" data-col="3"></div>
        <div class="grid-cell" data-row="3" data-col="4"></div>
        <div class="grid-cell" data-row="4" data-col="1"></div>
        <div class="grid-cell" data-row="4" data-col="2"></div>
        <div class="grid-cell" data-row="4" data-col="3"></div>
        <div class="grid-cell" data-row="4" data-col="4"></div>
      </div>

      <div class="tile-container"></div>
    </div>

    <p class="game-credit">
      Original game by <a href="https://play2048.co" rel="noopener">Gabriele Cirulli</a> — MIT licensed.
    </p>
  </div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/leaderboard-config.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/back_guard.js"></script>
  <script src="js/application.js"></script>
  <script>
    // Offline play. Registration failing (file://, no HTTPS) is not fatal —
    // the game runs regardless, it just will not be installable.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
